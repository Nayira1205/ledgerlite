# Local development database: MongoDB running as a ONE-node replica set.
# MongoDB only supports multi-document transactions (needed for transfers in
# Milestone 3) when it runs as a replica set, even if that set has a single member.
services:
  mongo:
    image: mongo:7
    container_name: ledgerlite-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      # Bound to 127.0.0.1 so ONLY your own computer can reach the database.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Starts the replica set the first time, then just reports that it is healthy.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo_data:
